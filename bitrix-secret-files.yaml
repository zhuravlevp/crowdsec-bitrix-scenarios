type: leaky
name: my/bitrix-secret-files
description: "Поиск dbconn.php и .settings.php"
filter: |
  evt.Meta.service == 'http' &&
  (evt.Parsed.program == 'nginx' || evt.Parsed.program == 'apache2') &&
  evt.Parsed.request matches "(?i)/(dbconn\\.php|\\.settings\\.php|\\.settings_extra\\.php)"
groupby: "evt.Meta.source_ip"
capacity: 2
leakspeed: "30s"
blackhole: 30m
labels:
  remediation: true
  type: "bitrix-secret-scan"
  service: http
