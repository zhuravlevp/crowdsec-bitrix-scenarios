type: leaky
name: my/bitrix-vfs-bypass
description: "Обход .htaccess через virtual_file_system.php"
filter: |
  evt.Meta.service == 'http' &&
  (evt.Parsed.program == 'nginx' || evt.Parsed.program == 'apache2') &&
  evt.Parsed.request matches "(?i)virtual_file_system\\.php"
groupby: "evt.Meta.source_ip"
capacity: 1
leakspeed: "10s"
blackhole: 30m
labels:
  remediation: true
  type: "bitrix-vfs-bypass"
  service: http
